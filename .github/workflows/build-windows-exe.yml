name: Build Windows ServerForge.exe

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck & automated tests
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Build standalone ServerForge.exe (Node 22 SEA)
        shell: pwsh
        run: .\scripts\build-windows-exe.ps1

      - name: Smoke-test compiled ServerForge.exe
        shell: pwsh
        run: |
          $TestDir = Join-Path $env:TEMP "sf-exe-smoke"
          New-Item -ItemType Directory -Force -Path $TestDir | Out-Null
          Copy-Item "dist-exe\ServerForge.exe" (Join-Path $TestDir "ServerForge.exe")

          $env:RUNTIME_MODE = "mock"
          $env:PORT = "3099"
          $env:NO_OPEN_BROWSER = "1"

          $proc = Start-Process -FilePath (Join-Path $TestDir "ServerForge.exe") -WorkingDirectory $TestDir -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3099/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  Write-Host "Health check passed: $($health | ConvertTo-Json -Compress)"
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) { throw "ServerForge.exe did not respond to /api/health" }

            $html = Invoke-WebRequest -Uri "http://127.0.0.1:3099/" -UseBasicParsing
            if ($html.Content -notmatch "ServerForge") {
              throw "Embedded React Web UI failed to load from ServerForge.exe"
            }
            if (-not (Test-Path (Join-Path $TestDir "catalog\games\minecraft-curseforge.yaml"))) {
              throw "Expected ServerForge.exe to extract built-in minecraft-curseforge.yaml on first run"
            }
            Write-Host "Standalone ServerForge.exe boot smoke test PASSED!"

            # Live Windows self-update swap verification: stage a copy as ServerForge.new.exe, run swap script, confirm relaunch!
            Write-Host "Testing live Windows ServerForge.exe atomic swap & relaunch..."
            $UpdatesDir = Join-Path $TestDir "data\updates"
            New-Item -ItemType Directory -Force -Path $UpdatesDir | Out-Null
            $CurrentExe = Join-Path $TestDir "ServerForge.exe"
            $NewExe = Join-Path $UpdatesDir "ServerForge.new.exe"
            $BackupExe = "$CurrentExe.bak"
            $LogFile = Join-Path $UpdatesDir "last-update.log"
            $SwapScript = Join-Path $UpdatesDir "apply-update.ps1"
            Copy-Item $CurrentExe $NewExe -Force

            $genCmd = "import { buildWindowsSwapScript } from './packages/server/dist/services/updater-service.js'; import fs from 'node:fs'; fs.writeFileSync(process.argv[1], buildWindowsSwapScript({ currentPid: Number(process.argv[2]), currentExePath: process.argv[3], newExePath: process.argv[4], backupExePath: process.argv[5], workingDir: process.argv[6], logPath: process.argv[7] }));"
            node --input-type=module -e $genCmd $SwapScript $proc.Id $CurrentExe $NewExe $BackupExe $TestDir $LogFile

            $swapProc = Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $SwapScript) -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 500
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $swapProc.WaitForExit(30000) | Out-Null

            if (-not (Test-Path $BackupExe)) {
              Write-Host (Get-Content $LogFile -Raw -ErrorAction SilentlyContinue)
              throw "Self-update swap did not create ServerForge.exe.bak"
            }

            $restartedOk = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h2 = Invoke-RestMethod -Uri "http://127.0.0.1:3099/api/health" -TimeoutSec 2
                if ($h2.status -eq "ok") {
                  Write-Host "Post-swap health check PASSED: $($h2 | ConvertTo-Json -Compress)"
                  $restartedOk = $true
                  break
                }
              } catch {}
            }
            Write-Host "--- last-update.log ---"
            Get-Content $LogFile -ErrorAction SilentlyContinue
            if (-not $restartedOk) { throw "Relaunched ServerForge.exe did not respond to /api/health after swap" }
            Write-Host "Live Windows self-update swap & relaunch PASSED!"
          } finally {
            Get-Process -Name "ServerForge" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 500
            Remove-Item -Path $TestDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload ServerForge.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerForge-win-x64
          path: dist-exe/ServerForge.exe

      - name: Publish GitHub Release with ServerForge.exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/ServerForge.exe
          generate_release_notes: true
          body: |
            ## ServerForge for Windows 11 (Standalone `.exe`)

            1. Download **`ServerForge.exe`** below into any folder on your Windows 11 server PC (for example `C:\ServerForge\ServerForge.exe`).
            2. Double-click **`ServerForge.exe`** — no Node.js installation needed!
            3. On first launch it creates `.env` and `catalog/games/*.yaml` next to the `.exe` and opens the Web Dashboard at `http://localhost:3000`.
            4. To enable the Discord Bot, open `.env` in Notepad, paste your `DISCORD_TOKEN`, `DISCORD_CLIENT_ID`, and `DISCORD_GUILD_ID`, and restart `ServerForge.exe`.
