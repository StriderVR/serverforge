name: Build Windows ServerForge.exe

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck & automated tests
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Build standalone ServerForge.exe (Node 22 SEA)
        shell: pwsh
        run: .\scripts\build-windows-exe.ps1

      - name: Smoke-test compiled ServerForge.exe & live self-update
        shell: pwsh
        run: |
          $TestDir = Join-Path $env:TEMP "sf exe smoke"
          if (Test-Path $TestDir) { Remove-Item -Path $TestDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $TestDir | Out-Null
          $SourceExe = (Resolve-Path "dist-exe\ServerForge.exe").Path
          Copy-Item $SourceExe (Join-Path $TestDir "ServerForge.exe")

          # Spin up a tiny local mock GitHub Releases API server serving ServerForge.exe as v9.9.9
          $MockScriptPath = Join-Path $env:TEMP "sf-mock-gh.mjs"
          @'
          import http from 'node:http';
          import fs from 'node:fs';
          const exePath = process.argv[2];
          const exeSize = fs.statSync(exePath).size;
          const server = http.createServer((req, res) => {
            if (req.url && req.url.includes('/releases/latest')) {
              const payload = JSON.stringify({
                tag_name: 'v9.9.9',
                name: 'ServerForge v9.9.9 (CI Self-Update Test)',
                body: 'Automated end-to-end Windows self-updater verification',
                html_url: 'http://127.0.0.1:3098/release/v9.9.9',
                published_at: new Date().toISOString(),
                assets: [{
                  name: 'ServerForge.exe',
                  browser_download_url: 'http://127.0.0.1:3098/download/ServerForge.exe',
                  size: exeSize,
                }],
              });
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(payload);
              return;
            }
            if (req.url === '/download/ServerForge.exe') {
              res.writeHead(200, {
                'content-type': 'application/octet-stream',
                'content-length': String(exeSize),
              });
              fs.createReadStream(exePath).pipe(res);
              return;
            }
            res.writeHead(404);
            res.end('not found');
          });
          server.listen(3098, '127.0.0.1', () => console.log('Mock GitHub API ready on 3098'));
          '@ | Set-Content -Path $MockScriptPath -Encoding UTF8

          $mockProc = Start-Process -FilePath "node" -ArgumentList @($MockScriptPath, $SourceExe) -PassThru -NoNewWindow

          $env:RUNTIME_MODE = "mock"
          $env:PORT = "3099"
          $env:NO_OPEN_BROWSER = "1"
          $env:UPDATER_API_BASE_URL = "http://127.0.0.1:3098"

          $proc = Start-Process -FilePath (Join-Path $TestDir "ServerForge.exe") -WorkingDirectory $TestDir -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3099/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  Write-Host "Initial health check passed (PID=$($proc.Id)): $($health | ConvertTo-Json -Compress)"
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) { throw "ServerForge.exe did not respond to /api/health" }

            $html = Invoke-WebRequest -Uri "http://127.0.0.1:3099/" -UseBasicParsing
            if ($html.Content -notmatch "ServerForge") {
              throw "Embedded React Web UI failed to load from ServerForge.exe"
            }
            if (-not (Test-Path (Join-Path $TestDir "catalog\games\minecraft-curseforge.yaml"))) {
              throw "Expected ServerForge.exe to extract built-in minecraft-curseforge.yaml on first run"
            }
            Write-Host "Standalone ServerForge.exe boot smoke test PASSED!"

            # Real end-to-end Windows self-update test via POST /api/updater/apply inside ServerForge.exe!
            Write-Host "Running REAL end-to-end POST /api/updater/apply self-update inside ServerForge.exe..."
            $setupRes = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3099/api/auth/setup" -ContentType "application/json" -Body '{"username":"admin","password":"testpassword123"}'
            $headers = @{ Authorization = "Bearer $($setupRes.token)" }

            $updStatus = Invoke-RestMethod -Uri "http://127.0.0.1:3099/api/updater/status?refresh=true" -Headers $headers
            Write-Host "Updater status: $($updStatus | ConvertTo-Json -Compress)"
            if (-not $updStatus.updateAvailable -or $updStatus.installMode -ne "exe" -or $updStatus.latestVersion -ne "9.9.9") {
              throw "Expected updateAvailable=true, installMode=exe, latestVersion=9.9.9"
            }

            $applyRes = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3099/api/updater/apply" -Headers $headers -ContentType "application/json" -Body '{"resumeRunningServers":true}'
            Write-Host "Apply response: $($applyRes | ConvertTo-Json -Compress)"

            $LogFile = Join-Path $TestDir "data\updates\last-update.log"
            $BackupExe = Join-Path $TestDir "ServerForge.exe.bak"

            Write-Host "Waiting for old ServerForge.exe (PID=$($proc.Id)) to download, spawn updater, and exit..."
            $exited = $proc.WaitForExit(30000)
            if (-not $exited) {
              Write-Host "--- last-update.log ---"
              Get-Content $LogFile -ErrorAction SilentlyContinue
              throw "Old ServerForge.exe (PID=$($proc.Id)) did not exit within 30s after POST /api/updater/apply"
            }
            Write-Host "Old ServerForge.exe (PID=$($proc.Id)) exited cleanly!"

            $restartedOk = $false
            $newPid = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $BackupExe) {
                try {
                  $h2 = Invoke-RestMethod -Uri "http://127.0.0.1:3099/api/health" -TimeoutSec 2
                  $runningProcs = Get-Process -Name "ServerForge" -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $proc.Id }
                  if ($h2.status -eq "ok" -and $runningProcs) {
                    $newPid = $runningProcs[0].Id
                    Write-Host "Post-update health check PASSED (new PID=$newPid): $($h2 | ConvertTo-Json -Compress)"
                    $restartedOk = $true
                    break
                  }
                } catch {}
              }
            }

            Write-Host "--- last-update.log ---"
            $logContent = Get-Content $LogFile -Raw -ErrorAction SilentlyContinue
            Write-Host $logContent

            if (-not (Test-Path $BackupExe)) {
              throw "Self-update swap did not create ServerForge.exe.bak"
            }
            if (-not $restartedOk) {
              throw "Relaunched ServerForge.exe did not respond to /api/health after real POST /api/updater/apply"
            }
            if ($logContent -notmatch "\[swap\] Installed new ServerForge\.exe successfully\.") {
              throw "Expected [swap] Installed new ServerForge.exe successfully. in last-update.log"
            }
            Write-Host "END-TO-END Windows ServerForge.exe self-update (old PID=$($proc.Id) -> new PID=$newPid) PASSED!"
          } finally {
            Get-Process -Name "ServerForge" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            if ($mockProc -and -not $mockProc.HasExited) {
              Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 500
            Remove-Item -Path $TestDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $MockScriptPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload ServerForge.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerForge-win-x64
          path: dist-exe/ServerForge.exe

      - name: Publish GitHub Release with ServerForge.exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/ServerForge.exe
          generate_release_notes: true
          body: |
            ## ServerForge for Windows 11 (Standalone `.exe`)

            1. Download **`ServerForge.exe`** below into any folder on your Windows 11 server PC (for example `C:\ServerForge\ServerForge.exe`).
            2. Double-click **`ServerForge.exe`** — no Node.js installation needed!
            3. On first launch it creates `.env` and `catalog/games/*.yaml` next to the `.exe` and opens the Web Dashboard at `http://localhost:3000`.
            4. To enable the Discord Bot, open `.env` in Notepad, paste your `DISCORD_TOKEN`, `DISCORD_CLIENT_ID`, and `DISCORD_GUILD_ID`, and restart `ServerForge.exe`.
