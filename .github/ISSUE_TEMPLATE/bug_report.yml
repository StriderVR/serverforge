name: Bug Report
description: Report a crash, launch failure, or unexpected behavior in ServerForge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: install_mode
    attributes:
      label: Install Mode
      options:
        - Standalone ServerForge.exe (Windows)
        - Run from source (Windows)
        - Run from source (Linux)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ServerForge Version
      placeholder: e.g., v1.1.7
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Game & Runtime Mode
      options:
        - Local Native Runtime
        - Docker Runtime
        - Mock Preview Mode
        - N/A (Dashboard / Updater / Settings)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What Happened?
      description: Describe the bug clearly, including what game template or action triggered it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / Error Logs
      description: Paste any relevant console output, browser error message, or updater log.
      render: text
    validations:
      required: false
